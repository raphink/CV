  <text x="78" y="76" fill="#61e0e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2.2">RAPHAËL PINSON · PORTFOLIO</text>
  <text x="78" y="177" fill="#f5fafb" font-family="Inter, Helvetica, Arial, sans-serif" font-size="67" font-weight="760" letter-spacing="-2.1">
    <tspan x="78" dy="0">Making infrastructure</tspan>
    <tspan x="78" dy="76">work better</tspan>
    <tspan x="78" dy="76" fill="#ffd562">for people.</tspan>
