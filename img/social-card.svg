  <text x="80" y="468" fill="#bdd2d7" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" font-weight="520">People × interfaces × systems</text>
  <line x1="80" y1="514" x2="760" y2="514" stroke="#ffffff" stroke-opacity=".2"/>
  <text x="80" y="558" fill="#a6c2ca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">DEVOPS  ·  PLATFORM ENGINEERING  ·  TECHNICAL EDUCATION</text>

  <rect x="894" y="136" width="230" height="230" rx="12" fill="#061820" stroke="#ffffff" stroke-opacity=".45"/>
  <image x="900" y="142" width="218" height="218" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait-clip)" xlink:href="raphael-pinson-2025.webp"/>
  <text x="899" y="401" fill="#f5fafb" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="720">Raphaël Pinson</text>
  <text x="899" y="427" fill="#a6c2ca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">LAUSANNE · SWITZERLAND</text>
