<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061820"/>
      <stop offset="1" stop-color="#0b303c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1a657b" stop-opacity=".72"/>
      <stop offset="1" stop-color="#1a657b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="portrait-clip">
      <rect x="900" y="142" width="218" height="218" rx="8"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1010" cy="332" r="292" fill="url(#glow)"/>
  <circle cx="1010" cy="332" r="270" fill="none" stroke="#61e0e7" stroke-opacity=".72"/>
  <circle cx="1010" cy="332" r="236" fill="none" stroke="#ffd562" stroke-opacity=".88"/>
