name: Sync public credentials

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image optimizer
        run: python -m pip install Pillow
      - name: Fetch public credentials
        run: python scripts/sync-public-credentials.py
      - name: Commit updated feed
        run: |
          if [ -z "$(git status --short -- certifications/credentials.json certifications/badges/)" ]; then
            echo "Credential feed is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certifications/credentials.json certifications/badges/
          git commit -m "Sync public credentials"
          git push
